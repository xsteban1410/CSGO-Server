[package]
name = "csgo-legacy-server-app"
description = "Desktop app for csgo-legacy-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "csgo-legacy-server-app"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
csls-core.workspace = true
serde_json = "1"
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "software-renderer-systemfonts",
    "system-tray",
] }
rfd = "0.17"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
i-slint-backend-testing = "1.18.1"

[build-dependencies]
slint-build = "1.18.1"
