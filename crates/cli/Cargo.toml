[package]
name = "csgo-legacy-server"
description = "Command line for csgo-legacy-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "csgo-legacy-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
csls-core.workspace = true
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde_json = "1"
