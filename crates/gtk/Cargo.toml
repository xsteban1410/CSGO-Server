[package]
name = "csgo-legacy-server-gtk"
description = "GTK app for csgo-legacy-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "csgo-legacy-server-gtk"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
csls-core.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
