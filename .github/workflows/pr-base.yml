name: Pull request base

# Contributor pull requests go to pre-releases. pull_request_target can edit fork PRs:
# so this must never check out or run PR code.
on:
  pull_request_target:
    types: [opened, reopened]
    branches: [master]

permissions:
  pull-requests: write

jobs:
  retarget:
    if: github.event.pull_request.user.login != github.repository_owner && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Change the base to pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api -X PATCH "repos/$GH_REPO/pulls/$PR" -f base=pre-releases --silent
          gh pr comment "$PR" --body "Contributions go to \`pre-releases\` first, so I changed the base branch. Once merged, the change reaches \`master\` after a day without problems. See [Branches](https://github.com/$GH_REPO/blob/master/CONTRIBUTING.md#branches)."
