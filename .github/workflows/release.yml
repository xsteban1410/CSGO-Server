name: Release

# Al llegar a master una versión nueva en Cargo.toml (tools/version.sh bump): pasa el CI, crea el tag y publica la release
# con el paquete y las notas del changelog. Sin versión nueva no hace nada.
on:
  push:
    branches: [master]
    paths: [Cargo.toml]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        name: Is this version new?
        run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "$tag is already released"
          else
            tools/version.sh check "$tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: version
    if: needs.version.outputs.tag != ''
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: dist
      - name: Publish
        run: |
          set -euo pipefail
          version=${TAG#v}
          pkg=$(basename dist/csgo-legacy-server-"$version"-*-x86_64.pkg.tar.zst)
          (cd dist && sha256sum "$pkg" > "$pkg.sha256")
          {
            tools/version.sh notes "$version"
            printf '\n## Install on Arch Linux\n\n```bash\nsudo pacman -U https://github.com/%s/releases/download/%s/%s\n```\n' "$GITHUB_REPOSITORY" "$TAG" "$pkg"
          } > notes.md
          gh release create "$TAG" dist/"$pkg" dist/"$pkg.sha256" --target "$GITHUB_SHA" --title "csgo-legacy-server $version" --notes-file notes.md
