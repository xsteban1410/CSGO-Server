name: Release

# When a new version in Cargo.toml reaches master (tools/version.sh bump): runs CI, creates the tag and publishes the release
# with the packages, SHA256SUMS and the changelog notes. Without a new version it does nothing.
on:
  push:
    branches: [master]
    paths: [Cargo.toml]
  # tools/promote.sh starts it: its push to master does not trigger workflows
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        name: Is this version new?
        run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "$tag is already released"
          else
            tools/version.sh check "$tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: version
    if: needs.version.outputs.tag != ''
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: bundles
          path: bundles
      - uses: actions/download-artifact@v8
        with:
          name: flatpak
          path: bundles
      - name: Publish
        run: |
          set -euo pipefail
          version=${TAG#v}
          pkg=$(basename dist/csgo-legacy-server-"$version"-*-x86_64.pkg.tar.zst)
          mv bundles/* dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          {
            tools/version.sh notes "$version"
            base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
            printf '\n## Install\n\n'
            printf 'Arch Linux:\n\n```bash\nsudo pacman -U %s/%s\n```\n\n' "$base" "$pkg"
            printf 'Debian 12 or newer, Ubuntu 24.04 or newer: download the `.deb`, then `sudo apt install ./csgo-legacy-server_%s_amd64.deb`\n\n' "$version"
            printf 'Any distro: the `.AppImage` (`chmod +x`, then run it), or the `.flatpak` (`flatpak install --user`, sandboxed: the server stops when you close the app).\n\n'
            printf 'Check a download with `sha256sum -c SHA256SUMS --ignore-missing`.\n'
          } > notes.md
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "csgo-legacy-server $version" --notes-file notes.md
