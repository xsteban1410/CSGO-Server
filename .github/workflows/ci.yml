name: CI

on:
  push:
    branches: [master, pre-releases]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust sqlite curl appstream desktop-file-utils fontconfig freetype2 libxkbcommon wayland ttf-dejavu
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-
      - name: Build
        run: cargo build --locked --release
      - name: Test
        run: cargo test --locked --release
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Desktop files
        run: |
          desktop-file-validate packaging/*.desktop
          appstreamcli validate --no-net packaging/*.metainfo.xml

  # Everything on other distros, not only Arch.
  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rust:slim
            deps: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl gcc libc6-dev libsqlite3-dev pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-dev libwayland-dev
          - image: fedora:latest
            deps: dnf install -y cargo gcc sqlite-devel pkgconf-pkg-config tar fontconfig-devel freetype-devel libxkbcommon-devel wayland-devel
    container: ${{ matrix.image }}
    steps:
      - name: Dependencies
        run: ${{ matrix.deps }}
      - uses: actions/checkout@v7
      - name: Build and test
        run: cargo test --locked -p csls-core -p csgo-legacy-server -p csgo-legacy-server-app

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev pkg-config
      - name: Build the CLI that the tests run
        run: cargo build --locked -p csgo-legacy-server
      - name: Vet
        working-directory: go
        run: go vet ./...
      - name: Lint the game files
        working-directory: go
        run: go run ./cmd/testkit -root .. lint
      - name: Test
        working-directory: go
        run: go test -race ./...
      - name: Known vulnerabilities
        working-directory: go
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Known vulnerabilities in dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit

  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: SourceMod compiler (the build in game/data/pinned.toml)
        run: |
          sudo dpkg --add-architecture i386 && sudo apt-get update -q && sudo apt-get install -yq lib32stdc++6
          read -r base file sum < <(python3 -c 'import tomllib; s = tomllib.load(open("game/data/pinned.toml", "rb"))["sourcemod"]; print(s["base"], s["file"], s["sha256"])')
          curl -fsSL --proto =https -o sm.tar.gz "$base/$file"
          echo "$sum  sm.tar.gz" | sha256sum -c -
          tar xzf sm.tar.gz
      - name: Compile the engine plugins
        run: |
          set -e
          inc=addons/sourcemod/scripting/include
          # what deploy compiles: game/plugin/<name>.sp and game/plugin/<name>/<name>.sp; the rest are includes of modos.sp
          for p in game/plugin/*.sp game/plugin/*/*.sp; do
            name=$(basename "$p" .sp)
            case "$p" in game/plugin/modos_*.sp) continue ;; game/plugin/*/*.sp) [ "$(basename "$(dirname "$p")")" = "$name" ] || continue ;; esac
            echo "== $name"
            addons/sourcemod/scripting/spcomp64 -i$inc -igame/plugin -igame/plugin/include "$p" -o/tmp/out.smx
          done

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shell scripts
        run: shellcheck tools/*.sh packaging/*.sh packaging/aur/*.sh packaging/appimage/AppRun
      - name: Version is the same everywhere
        run: tools/version.sh check
      - name: Promotion rules
        run: tools/test-promote.sh
      - name: English outside translation files
        run: |
          ! git grep -nIP '[áéíóúñÁÉÍÓÚÑ¿¡]' -- . ':!README.es.md' ':!crates/app/lang/*' ':!game/plugin/translations/*' \
            ':!crates/core/src/skins_gen.rs' ':!packaging/*.metainfo.xml' ':!.github/workflows/ci.yml' | grep -v 'Español'
      - name: README translation
        run: python3 tools/test_sync_readme.py

  # Each commit's package: Actions tab > the run > Artifacts, or `gh run download -n package`.
  package:
    needs: [rust, go, plugins, scripts]
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust go fontconfig freetype2 libxkbcommon wayland ttf-dejavu sqlite curl namcap
      - uses: actions/checkout@v7
      - name: Build package
        # makepkg does not run as root; tests already passed in the rust job
        run: |
          useradd -m builder
          chown -R builder .
          sudo -u builder packaging/build-pkg.sh dist --nocheck
      - name: Lint
        run: |
          namcap packaging/aur/*/PKGBUILD
          namcap dist/*.pkg.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  bundles:
    needs: [rust, go, plugins, scripts]
    runs-on: ubuntu-latest
    # the oldest system these packages support: they do not run on an older glibc than the one they were built on
    container: rust:slim-bookworm
    steps:
      - name: Dependencies
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl gcc libc6-dev pkg-config squashfs-tools libsqlite3-dev libfontconfig-dev libfreetype-dev libxkbcommon-dev libwayland-dev
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Build the .deb and the AppImage
        run: packaging/build-bundles.sh dist
      - name: Try them
        run: |
          apt-get install -y --no-install-recommends ./dist/*.deb
          csgo-legacy-server modes > /dev/null
          ! ldd /usr/bin/csgo-legacy-server-app | grep 'not found'
          APPIMAGE_EXTRACT_AND_RUN=1 dist/*.AppImage modes > /dev/null
          CSLS_SCREENSHOT=/tmp/app.png csgo-legacy-server-app
          test -s /tmp/app.png
      - uses: actions/upload-artifact@v7
        with:
          name: bundles
          path: dist/*
          if-no-files-found: error

  flatpak:
    needs: [rust, go, plugins, scripts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder librsvg2-common
          # flatpak's sandbox needs user namespaces, which Ubuntu restricts
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --repo=repo build packaging/flatpak/io.github.xsteban1410.CsgoLegacyServer.yml
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir dist
          flatpak build-bundle repo "dist/csgo-legacy-server-$version-x86_64.flatpak" io.github.xsteban1410.CsgoLegacyServer --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Try it in the sandbox
        run: |
          id=io.github.xsteban1410.CsgoLegacyServer
          flatpak install --user -y --noninteractive dist/*.flatpak
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform.Compat.i386//25.08
          flatpak run --command=csgo-legacy-server "$id" modes > /dev/null
          # what the install and the server need from the runtime, and the 32-bit loader for srcds and steamcmd
          flatpak run --command=sh "$id" -c 'command -v curl tar sha256sum setsid xdg-open && /lib/ld-linux.so.2 --version'
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: dist/*.flatpak
          if-no-files-found: error
