name: CI

on:
  push:
    branches: [master, pre-releases]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita sqlite curl appstream desktop-file-utils
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-
      - name: Build
        run: cargo build --locked --release
      - name: Test
        run: cargo test --locked --release
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Desktop files
        run: |
          desktop-file-validate packaging/*.desktop
          appstreamcli validate --no-net packaging/*.metainfo.xml

  # Core and CLI on other distros. The GTK app is built on Arch only, see the job above.
  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rust:slim
            deps: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl gcc libc6-dev libsqlite3-dev pkg-config
          - image: fedora:latest
            deps: dnf install -y cargo gcc sqlite-devel pkgconf-pkg-config tar
    container: ${{ matrix.image }}
    steps:
      - name: Dependencies
        run: ${{ matrix.deps }}
      - uses: actions/checkout@v7
      - name: Build and test
        run: cargo test --locked -p csls-core -p csgo-legacy-server

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Known vulnerabilities in dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit

  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: SourceMod compiler
        run: |
          sudo dpkg --add-architecture i386 && sudo apt-get update -q && sudo apt-get install -yq lib32stdc++6
          base=https://sm.alliedmods.net/smdrop/1.12
          curl -fsSL "$base/$(curl -fsSL $base/sourcemod-latest-linux)" | tar xz
      - name: Compile plugins
        run: |
          set -e
          inc=addons/sourcemod/scripting/include
          for p in plugin/modos.sp plugin/modos_cheats.sp plugin/skins.sp plugin/csls_directconnect/csls_directconnect.sp; do
            addons/sourcemod/scripting/spcomp64 -i$inc -iplugin "$p" -o/tmp/out.smx
          done

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shell scripts
        run: shellcheck tools/*.sh packaging/*.sh packaging/aur/*.sh
      - name: Version is the same everywhere
        run: tools/version.sh check
      - name: Promotion rules
        run: tools/test-promote.sh
      - name: English outside translation files
        run: |
          ! git grep -nIP '[áéíóúñÁÉÍÓÚÑ¿¡]' -- . ':!README.es.md' ':!crates/gtk/src/i18n.rs' ':!modes/*.toml' ':!plugin/translations/*' \
            ':!data/skins.es.cfg' ':!crates/core/src/skins_gen.rs' ':!packaging/*.metainfo.xml' ':!.github/workflows/ci.yml' | grep -v 'Español'
      - name: README translation
        run: python3 tools/test_sync_readme.py

  # Each commit's package: Actions tab > the run > Artifacts, or `gh run download -n package`.
  package:
    needs: [rust, plugins, scripts]
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita sqlite curl namcap
      - uses: actions/checkout@v7
      - name: Build package
        # makepkg does not run as root; tests already passed in the rust job
        run: |
          useradd -m builder
          chown -R builder .
          sudo -u builder packaging/build-pkg.sh dist --nocheck
      - name: Lint
        run: |
          namcap packaging/aur/*/PKGBUILD
          namcap dist/*.pkg.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
