name: Game mode
description: Propose a new mode, or report one that plays wrong
labels: [game-mode]
body:
  - type: markdown
    attributes:
      value: |
        If bots or rules misbehave, say which mode, match type and map. You can also build your own mode in the app's **Modes** tab and share its `.toml`.
  - type: dropdown
    id: kind
    attributes:
      label: What is this about?
      options: [A new mode, An existing mode plays wrong]
    validations:
      required: true
  - type: input
    id: mode
    attributes:
      label: Mode, match type and map
      placeholder: awpdm, deathmatch, de_dust2
  - type: textarea
    id: rules
    attributes:
      label: How should it play?
      description: Weapons, teams, respawn, rounds and how to win. For a wrong mode, what you see instead.
    validations:
      required: true
  - type: checkboxes
    id: tested
    attributes:
      label: Tested with
      options:
        - label: Only me and bots
        - label: Several human players
