// competitivo: Valve's competitive rules untouched (gamemode_competitive.cfg): economy, MR15, half-time swap, overtime.
// Bots fill the 5v5 seats. bot_quota with mode fill counts humans too, so 10 means 5v5.
modo_equipos juntos
modo_listos 1
mp_humanteam any
bot_join_team any
bot_quota_mode fill
mp_halftime 1
mp_overtime_enable 1
bot_quota 10
mp_warmuptime 90
mp_overtime_maxrounds 6
mp_overtime_startmoney 10000
