// Classic round rules. Runs after modo_base only with game_type 0: Valve's other types bring their own rules.
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_buy_anywhere 0
mp_death_drop_gun 1
mp_buy_allow_grenades 1
mp_warmuptime 60
// Casual rules keep sides for the whole match. Modes with half time (competitivo...) set it back.
mp_halftime 0
// Danger Zone and co-op need these, so they cannot go in modo_base.cfg.
mp_weapons_allow_heavyassaultsuit 0
mp_taser_recharge_time -1
sv_disable_radar 0
